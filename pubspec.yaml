name: fluxer_dart_rest
description: >-
  REST client for Fluxer: an HttpTransport adapter over package:http,
  reactive rate-limit bucket tracking from Fluxer's own X-RateLimit-*
  response headers, and resource-oriented managers over fluxer_dart_core models.
version: 0.2.0
homepage: https://github.com/oppahansi/fluxer_dart_rest
repository: https://github.com/oppahansi/fluxer_dart_rest
# Not on pub.dev yet — remove this line once it's actually published there.
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  # Pinned to a tagged sibling release so a plain `dart pub get` works
  # for anyone who clones just this repo. Local development overrides
  # these to sibling directories via pubspec_overrides.yaml (gitignored,
  # not this file) — see CONTRIBUTING.md.
  fluxer_dart_core:
    git:
      url: https://github.com/oppahansi/fluxer_dart_core.git
      ref: v0.2.0
  fluxer_dart_utils:
    git:
      url: https://github.com/oppahansi/fluxer_dart_utils.git
      ref: v0.1.0
  http: ^1.6.0

dev_dependencies:
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: ^1.31.2
